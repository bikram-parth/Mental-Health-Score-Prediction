<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mindscroll — Mental Health Prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow-field" aria-hidden="true">
    <span class="dot d1"></span>
    <span class="dot d2"></span>
    <span class="dot d3"></span>
    <span class="dot d4"></span>
    <span class="dot d5"></span>
    <span class="dot d6"></span>
  </div>

  <main class="page">
    <header class="hero">
      <p class="hero-eyebrow">a quiet check-in</p>
      <h1 class="hero-title">Mindscroll</h1>
      <p class="hero-sub">Tell us how you use your time and your screen. We'll estimate where your mind might be sitting right now.</p>
    </header>

    <section class="panel" id="formPanel">
      <form id="predictForm" novalidate>

        <div class="field-grid">

          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="Age" min="10" max="100" placeholder="e.g. 21" required>
          </div>

          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="Gender" required>
              <option value="" disabled selected>Choose one</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>

          <div class="field">
            <label for="country">Country</label>
            <input type="text" id="country" name="Country" placeholder="e.g. India" required>
          </div>

          <div class="field">
            <label for="academicLevel">Academic level</label>
            <select id="academicLevel" name="Academic_Level" required>
              <option value="" disabled selected>Choose one</option>
              <option value="High School">High School</option>
              <option value="Undergraduate">Undergraduate</option>
              <option value="Graduate">Graduate</option>
            </select>
          </div>

          <div class="field">
            <label for="platform">Most used platform</label>
            <select id="platform" name="Most_Used_Platform" required>
              <option value="" disabled selected>Choose one</option>
              <option value="Facebook">Facebook</option>
              <option value="LinkedIn">LinkedIn</option>
              <option value="Instagram">Instagram</option>
              <option value="Snapchat">Snapchat</option>
              <option value="Twitter">Twitter</option>
              <option value="YouTube">YouTube</option>
              <option value="TikTok">TikTok</option>
              <option value="LINE">LINE</option>
              <option value="KakaoTalk">KakaoTalk</option>
              <option value="VKontakte">VKontakte</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="WeChat">WeChat</option>
            </select>
          </div>

          <div class="field">
            <label for="purpose">Main purpose of use</label>
            <select id="purpose" name="Purpose_Of_Use" required>
              <option value="" disabled selected>Choose one</option>
              <option value="Networking">Networking</option>
              <option value="Education">Education</option>
              <option value="Entertainment">Entertainment</option>
              <option value="News">News</option>
            </select>
          </div>

          <div class="field">
            <label for="dailyUsage">Avg. daily usage (hours)</label>
            <input type="number" id="dailyUsage" name="Avg_Daily_Usage_Hours" min="0" max="24" placeholder="e.g. 5" required>
          </div>

          <div class="field">
            <label for="unlocks">Daily phone unlocks</label>
            <input type="number" id="unlocks" name="Daily_Unlocks" min="0" placeholder="e.g. 60" required>
          </div>

          <div class="field">
            <label for="studyHours">Study hours per day</label>
            <input type="number" id="studyHours" name="Study_Hours" min="0" max="24" placeholder="e.g. 3" required>
          </div>

          <div class="field">
            <label for="activityHours">Physical activity (hours)</label>
            <input type="number" id="activityHours" name="Physical_Activity_Hours" min="0" max="24" placeholder="e.g. 1" required>
          </div>

          <div class="field">
            <label for="sleepHours">Sleep per night (hours)</label>
            <input type="number" id="sleepHours" name="Sleep_Hours_Per_Night" min="0" max="24" placeholder="e.g. 7" required>
          </div>

          <div class="field">
            <label for="stress">Current stress level</label>
            <select id="stress" name="Stress_Level" required>
              <option value="" disabled selected>Choose one</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Very High">Very High</option>
            </select>
          </div>

        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="btn-label">Read my results</span>
        </button>

        <p class="form-error" id="formError" role="alert"></p>
      </form>
    </section>

    <!-- Loading state -->
    <section class="loading-panel" id="loadingPanel" hidden aria-live="polite">
      <div class="orbit">
        <span class="orbit-core"></span>
        <span class="orbit-ring"></span>
      </div>
      <p class="loading-text" id="loadingText">Reading the signals&hellip;</p>
    </section>

    <!-- Result state -->
    <section class="result-panel" id="resultPanel" hidden>
      <div class="result-card">
        <p class="result-eyebrow">your estimated score</p>
        <div class="result-score" id="resultScore">0</div>
        <p class="result-caption" id="resultCaption">out of 10</p>
        <div class="result-meter">
          <div class="result-meter-fill" id="resultMeterFill"></div>
        </div>
        <p class="result-note" id="resultNote"></p>
        <button type="button" class="retry-btn" id="retryBtn">Check again</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
